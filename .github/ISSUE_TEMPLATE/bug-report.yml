name: Relatar um bug
description: Comportamento incorreto ou regressão reproduzível
title: "bug: "
labels:
- bug
body:
- type: markdown
  attributes:
    value: Não inclua CPF, CNPJ ou dados pessoais reais. Use valores públicos de exemplo.

- type: input
  id: version
  attributes:
    label: Versão
    placeholder: 2.0.1
  validations:
    required: true

- type: input
  id: environment
  attributes:
    label: Ambiente
    placeholder: Node 20, ESM, TypeScript 5.x
  validations:
    required: true

- type: textarea
  id: reproduction
  attributes:
    label: Reprodução mínima
    description: Inclua entrada anonimizada, código mínimo, resultado atual e esperado.
  validations:
    required: true

- type: textarea
  id: impact
  attributes:
    label: Impacto
    description: Quem é afetado e existe alguma mitigação?
  validations:
    required: true

- type: checkboxes
  id: checks
  attributes:
    label: Verificações
    options:
    - label: Não incluí dados pessoais ou documentos reais.
      required: true
    - label: Confirmei que o problema ocorre na versão mais recente.
      required: true
