name: Release package

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
        - latest
        - next
      dry_run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
        registry-url: https://registry.npmjs.org

    - name: Install locked dependencies
      run: npm ci

    - name: Verify source and package
      run: npm run verify

    - name: Inspect package without publishing
      if: inputs.dry_run
      run: npm pack --dry-run

    - name: Publish with provenance
      if: ${{ !inputs.dry_run }}
      run: npm publish --provenance --access public --tag "${{ inputs.npm_tag }}"
